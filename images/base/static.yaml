# Minimal runtime for static binaries (Go CGO_ENABLED=0). Replaces alpine:3.20 / distroless/static.
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - alpine-baselayout-data
    - alpine-release
    - ca-certificates-bundle
    - tzdata
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: "65532"
work-dir: /app
paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
archs:
  - amd64
  - arm64
annotations:
  org.opencontainers.image.source: https://github.com/StaffOps/golden-images
  org.opencontainers.image.vendor: StaffOps
  org.opencontainers.image.description: "Minimal non-root base for static binaries"
