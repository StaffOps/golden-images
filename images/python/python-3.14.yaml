# Python 3.14 runtime (non-root, no shell, no pip). Copy a venv built in python:3.14-dev.
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - alpine-baselayout-data
    - alpine-release
    - ca-certificates-bundle
    - tzdata
    - python3=~3.14
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: "65532"
work-dir: /app
paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
environment:
  LANG: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
entrypoint:
  command: /usr/bin/python3
archs:
  - amd64
  - arm64
annotations:
  org.opencontainers.image.source: https://github.com/StaffOps/golden-images
  org.opencontainers.image.vendor: StaffOps
  org.opencontainers.image.description: "Python 3.14 runtime"
