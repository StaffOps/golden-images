# .NET 10 SDK build image (root, shell).
contents:
  keyring:
    - ./dist/packages/melange.rsa.pub
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    - '@local /work/dist/packages'
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - tzdata
    - msft-dotnet-sdk-10@local
    - bash
    - busybox
    - git
    - openssh-client
    - curl
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: "0"
work-dir: /src
paths:
  # Scanner hint, outside any apk: Trivy skips files owned by OS packages, so the packaged
  # deps.json (NuGet runtime packs) is exposed again via a hardlink. Trivy and Dependency-Track
  # then match .NET runtime CVEs (GitHub advisories) on this image and on every image built FROM it.
  - path: /usr/share/dotnet-sbom/runtime.deps.json
    type: hardlink
    source: /usr/share/dotnet/staffops-runtime.deps.json
environment:
  DOTNET_ROOT: /usr/share/dotnet
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_RUNNING_IN_CONTAINER: "true"
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
  NUGET_XMLDOC_MODE: skip
  PATH: /root/.dotnet/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
cmd: /bin/bash -l
archs:
  - amd64
  - arm64
annotations:
  org.opencontainers.image.source: https://github.com/StaffOps/golden-images
  org.opencontainers.image.vendor: StaffOps
  org.opencontainers.image.description: ".NET 10 SDK"
