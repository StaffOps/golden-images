# ASP.NET Core 10 runtime (non-root, no shell).
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  packages:
    - alpine-baselayout-data
    - alpine-release
    - ca-certificates-bundle
    - tzdata
    - aspnetcore10-runtime
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: "65532"
work-dir: /app
paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
environment:
  DOTNET_ROOT: /usr/lib/dotnet
  DOTNET_RUNNING_IN_CONTAINER: "true"
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
  ASPNETCORE_HTTP_PORTS: "8080"
entrypoint:
  command: /usr/bin/dotnet
archs:
  - amd64
  - arm64
annotations:
  org.opencontainers.image.source: https://github.com/StaffOps/golden-images
  org.opencontainers.image.vendor: StaffOps
  org.opencontainers.image.description: "ASP.NET Core 10 runtime"
