# .NET 10 SDK incl. runtimes (official Microsoft linux-musl build).
# Why custom instead of Alpine's dotnet10-*: Alpine stable skipped security releases
# 10.0.5 and 10.0.11 (30 days on a runtime with known CVEs) and keeps the SDK on an older
# feature band. Microsoft's musl tarballs ship the same day as the release.
# Source of truth for versions and hashes: the releases.json metadata published by Microsoft:
# https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json
# renovate: datasource=dotnet-version depName=dotnet-sdk
package:
  name: msft-dotnet-sdk-10
  version: 10.0.404
  epoch: 0
  description: ".NET 10 SDK incl. runtimes (official Microsoft linux-musl build)"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - icu-libs
      - krb5-libs
      - libgcc
      - libssl3
      - libstdc++
      - tzdata
      - zlib
  options:
    # .NET dlopen()s ICU/OpenSSL instead of linking them; the deps above are explicit.
    no-depends: true
    no-provides: true

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    packages:
      - busybox
      - ca-certificates-bundle
      - icu-libs
      - libgcc
      - libssl3
      - libstdc++
      - zlib

pipeline:
  - runs: mkdir -p dotnet

  - assertions:
      required-steps: 1
    pipeline:
      - uses: fetch
        if: ${{build.arch}} == 'x86_64'
        with:
          uri: https://builds.dotnet.microsoft.com/dotnet/Sdk/${{package.version}}/dotnet-sdk-${{package.version}}-linux-musl-x64.tar.gz
          expected-sha512: 68ada5fd8fa2b65f55c3db1c2e773dfc9468c9828cbb56fc600151415cc2b116a32804f9aeeb82ca1a3229e3821af7b5b074d5e34487b2807630b5c00f51d801
          strip-components: 0
          directory: dotnet
      - uses: fetch
        if: ${{build.arch}} == 'aarch64'
        with:
          uri: https://builds.dotnet.microsoft.com/dotnet/Sdk/${{package.version}}/dotnet-sdk-${{package.version}}-linux-musl-arm64.tar.gz
          expected-sha512: b39da19b6134190ed0b9107c05c98c58586f4f77782c4b0e3e36c6274a2d59528f67412c2b0cbb927a914378177f763cb662b435c5bef62ad5c2cd86a422c877
          strip-components: 0
          directory: dotnet

  - runs: |
      set -eu
      mkdir -p "${{targets.destdir}}/usr/share" "${{targets.destdir}}/usr/bin"
      mv dotnet "${{targets.destdir}}/usr/share/dotnet"
      ln -s /usr/share/dotnet/dotnet "${{targets.destdir}}/usr/bin/dotnet"
      # Vulnerability-scanner hint. Our apk names (msft-*) are unknown to CVE databases, so
      # declare the bundled shared frameworks as their official NuGet runtime packs. Trivy and
      # Dependency-Track match those against GitHub advisories. The dotnet host ignores this
      # file (it only reads shared/<fw>/<ver>/<fw>.deps.json).
      d="${{targets.destdir}}/usr/share/dotnet"
      rid=x64; [ "${{build.arch}}" = "aarch64" ] && rid=arm64
      targets=""; libs=""
      for fw in Microsoft.NETCore.App Microsoft.AspNetCore.App; do
        [ -d "$d/shared/$fw" ] || continue
        v="$(ls "$d/shared/$fw" | sort -V | tail -n1)"
        id="$fw.Runtime.linux-musl-$rid/$v"
        targets="$targets${targets:+,}\"$id\": {\"runtime\": {\"$fw.dll\": {}}}"
        libs="$libs${libs:+,}\"$id\": {\"type\": \"package\", \"serviceable\": true}"
      done
      printf '{"runtimeTarget":{"name":".NETCoreApp,Version=v10.0/linux-musl-%s"},"targets":{".NETCoreApp,Version=v10.0/linux-musl-%s":{%s}},"libraries":{%s}}\n' \
        "$rid" "$rid" "$targets" "$libs" > "$d/staffops-runtime.deps.json"
      cat "$d/staffops-runtime.deps.json"

      # Smoke test with the freshly installed files.
      DOTNET_ROOT="${{targets.destdir}}/usr/share/dotnet" \
        "${{targets.destdir}}/usr/share/dotnet/dotnet" --info
