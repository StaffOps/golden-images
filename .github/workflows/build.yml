name: build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild so Alpine security fixes land without a code change.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "Family (node, python, go, dotnet, base), image name, or 'all'"
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Publish only from main (push, schedule, manual); PRs build and test.
  PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  packages:
    name: packages (melange)
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # plan.sh diffs against the previous commit / PR base
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      # The mounted APK cache: latest version of each package + its signing key.
      # Key changes only when a spec or the toolchain changes; restore-keys lets an
      # unchanged package be reused while only the changed one rebuilds.
      - name: Restore package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/packages
          key: apk-${{ hashFiles('apks/**', 'toolchain/Dockerfile') }}
          restore-keys: apk-

      - name: Build packages (cache-aware, both archs)
        run: scripts/golden.sh packages --arch x86_64,aarch64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-cache
          # Public-repo artifacts are downloadable by any GitHub user: ship the public key
          # and the packages, never the private signing key.
          path: |
            dist/packages
            !dist/packages/melange.rsa
          retention-days: 1

      # Each image is built individually, only when it is affected (like per-image
      # `rules: changes:` in the reference repo, but derived from catalog.json):
      #   push / PR      → scripts/plan.sh base..head (image config, its packages, its tests, ...)
      #   schedule       → every image; publish is still skipped when the content fingerprint is unchanged
      #   manual         → the chosen family / image / all
      - name: Plan image matrix
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          case "$EVENT" in
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then imgs=$(scripts/plan.sh --all)
              else imgs=$(scripts/plan.sh "$BEFORE" HEAD); fi;;
            pull_request)
              imgs=$(scripts/plan.sh "$(git merge-base "origin/$BASE_REF" HEAD)" HEAD);;
            workflow_dispatch)
              if [ "$TARGET" = all ]; then imgs=$(scripts/plan.sh --all)
              else imgs=$(jq -c --arg t "$TARGET" '[.images[] | select(.name == $t or (.config | startswith("images/" + $t + "/"))) | .name]' catalog.json); fi;;
            *)
              imgs=$(scripts/plan.sh --all);;
          esac
          echo "images: $imgs"
          echo "images=$imgs" >> "$GITHUB_OUTPUT"
          echo "### Images planned: $imgs" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: ${{ matrix.image }}
    needs: packages
    if: needs.packages.outputs.images != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to ghcr.io/staffops
      id-token: write   # keyless cosign signing (Sigstore/Fulcio via GitHub OIDC)
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.packages.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The golden marker package is built per arch with melange, so arm64 needs emulation here too.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-cache
          path: dist/packages

      - name: Pin build version (golden marker package)
        run: echo "GOLDEN_BUILD_VERSION=$(date -u +%Y%m%d.%H%M%S)" >> "$GITHUB_ENV"

      - name: Build (amd64 + arm64) and load
        run: scripts/build-image.sh "${{ matrix.image }}" --arch amd64,arm64

      - name: Resolve local ref
        id: ref
        run: echo "amd64=$(scripts/ref.sh ${{ matrix.image }})-amd64" >> "$GITHUB_OUTPUT"

      - name: Smoke test (amd64)
        run: scripts/test-image.sh "${{ matrix.image }}" "${{ steps.ref.outputs.amd64 }}"

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes the image built and tested above, byte for byte (crane, no rebuild).
      # Skipped (published=false) when the content fingerprint equals the one already on
      # GHCR: same digest, same marker version, nothing for scanners to re-ingest.
      - name: Publish multi-arch index (+ dated tags), only if content changed
        id: publish
        if: env.PUBLISH == 'true'
        env:
          DOCKER_CONFIG_MOUNT: /home/runner/.docker
        run: scripts/build-image.sh "${{ matrix.image }}" --arch amd64,arm64 --publish --suffix "$(date -u +%Y%m%d)"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.publish.outputs.published == 'true'

      - name: Sign by digest (keyless)
        if: steps.publish.outputs.published == 'true'
        run: cosign sign --yes "$(cat dist/images/${{ matrix.image }}.digest)"

      - name: Attach SBOM attestation (keyless)
        if: steps.publish.outputs.published == 'true'
        run: |
          cosign attest --yes --type spdxjson \
            --predicate "dist/sbom/${{ matrix.image }}/sbom-index.spdx.json" \
            "$(cat dist/images/${{ matrix.image }}.digest)"

      # Scans the built OCI layout, one single-arch layout per arch: the same blobs and
      # manifests that were (or, on PRs, would be) published. Report only.
      - name: Vulnerability scan amd64 (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: dist/images/${{ matrix.image }}.amd64-arm64.oci-amd64
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Vulnerability scan arm64 (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: dist/images/${{ matrix.image }}.amd64-arm64.oci-arm64
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true
