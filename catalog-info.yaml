# Backstage catalog: Domain (GitHub org) -> System (this repo) -> Component(s).
# Names aligned with Dependency-Track (StaffOps/homelab-gitops helm-charts/argo-events/image-scan/catalog.yaml).
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: golden-images
  title: golden-images
  description: "Minimal, multi-arch, signed base images (apko + melange) for StaffOps projects"
  annotations:
    github.com/project-slug: StaffOps/golden-images
  links:
    - url: https://github.com/StaffOps/golden-images
      title: Repository
      icon: github
spec:
  owner: group:staffops
  domain: staffops
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: golden-static
  title: static
  description: "Container image ghcr.io/staffops/static"
  annotations:
    github.com/project-slug: StaffOps/golden-images
    staffops.space/image: ghcr.io/staffops/static
    staffops.space/dependency-track-project: ghcr.io/staffops/static
  tags: [container-image, multi]
spec:
  type: library
  lifecycle: production
  owner: group:staffops
  system: golden-images
