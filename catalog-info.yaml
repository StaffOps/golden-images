    github.com/project-slug: StaffOps/golden-images
    backstage.io/techdocs-ref: dir:.
    argoworkflows.argoproj.io/workflow-selector: app.kubernetes.io/part-of=golden-images
    backstage.io/kubernetes-namespace: argo-workflows
  tags: [apko, melange, alpine, container-image, shell]
  links:
    - url: https://github.com/StaffOps/golden-images
